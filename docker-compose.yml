# Development-only PostgreSQL instance.
# This phase (B-1) only PREPARES the connection — no business tables are created.
services:
  db:
    image: postgres:16-alpine
    container_name: motion-erp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-motion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-motion_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-motion_erp}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - motion-erp-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-motion} -d ${POSTGRES_DB:-motion_erp}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  motion-erp-db-data:
